name: Qloo Event API Smoke

on:
  push:
    branches:
      - feature/qloo-rest-validation-20261015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qloo-event-api-smoke
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated Qloo candidate
        uses: actions/checkout@v4
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reproduce clean install
        run: npm ci --omit=dev --ignore-scripts --no-fund
      - name: Run offline tests
        run: npm test
      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Qloo event API and agent with protected secret
        env:
          QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
          QLOO_TEST_INSPECT: '1'
        run: node scripts/qloo-smoke.mjs
